[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resp-analysis"
version = "0.1.0"
description = "Modular Respiratory Neurophysiology & Spike Sorting Analysis Pipeline"
authors = [
    { name = "Leila Pascual", email = "pascual@example.com" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    "plotly>=5.0.0",
]

[project.scripts]
run-pipeline = "scripts.pipeline.run_sliding_window_pipeline:main"
