# Fresh environment for npxsort. Create it, then install torch (CUDA build) BEFORE requirements.txt:
#   conda env create -f environment.yml
#   conda activate npxsort
#   pip install torch --index-url https://download.pytorch.org/whl/cu126     (pick your CUDA build on pytorch.org)
#   pip install -r requirements.txt
#   python check_env.py
name: npxsort
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
