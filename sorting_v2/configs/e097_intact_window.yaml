# e097, intact window: 420 s CatGT extract (raw run g2, 1740-2160 s), Neuropixels imec0.
# Only settings that differ from npxsort/defaults.yaml are listed.

experiment_name: e097_intact_window_420s

paths:
  output_dir: C:/Users/lpascu/resp_analysis/outputs/e097/intact_window_v2
  scratch_dir: C:/SCRATCH_neuropixels/sorting_v2/e097_intact_window   # ~10 GB preprocessed binary + sorter folders

input:
  source: catgt   # CatGT: -apfilter=butter,12,300,9000 -loccar_um=75,300, already phase-shifted
  folder: C:/SCRATCH_neuropixels/catgt_e097_intact_420s/catgt_e097_g2
  stream_id: imec0.ap
  # Spike times are seconds from the start of this CatGT file. Add 1740 s for raw-run time.

motion:
  # Off for this recording. The first run (2026-10-15) showed no drift (median 0.3 um); DREDGE's only
  # "motion" was an unreliable +70/-45 um estimate during the ~85-125 s activity dropout, and
  # correcting it bent the spike bands. The sorters' own drift correction is switched off too.
  enabled: false

sorters:
  kilosort4:
    enabled: true
    params:
      torch_device: cuda   # fail immediately if the GPU is not visible rather than silently using the CPU
      do_correction: false
  lupin:
    enabled: true
    params:
      apply_motion_correction: false
      job_kwargs:
        # Lupin's clustering step gives every worker its own ~1.2 GB copy of the peak features
        # (1.85 M peaks). With 12 workers that ran out of memory on Windows on 2026-10-16
        # (OSError Errno 22 / pickle data was truncated). Other job settings come from job_kwargs below.
        n_jobs: 4

job_kwargs:
  n_jobs: 12

curation:
  threshold_overrides:
    mua:
      # Bombcell demotes units present in < 70% of the recording to MUA. Respiratory neurons can
      # stop firing during apnea/anoxia, so presence is reported in units.tsv but not used to label.
      presence_ratio: null
