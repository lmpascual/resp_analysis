# e097, anoxia #2 window: 360 s CatGT extract (raw run g2, 2250-2610 s), Neuropixels imec0.
# Same settings as configs/e097_intact_window.yaml; only paths, epochs and the extraction rule differ.
# Window chosen 2026-10-19 from outputs/e097/anoxia_recovery/intact_window_kilosort4 (anoxia #1: 90% of units
# that return do so by ~200 s after the switch) and the breathing rate around anoxia #2 (back to ~155/min by
# ~2545 s raw): 60 s baseline + 300 s after the gas switch.

experiment_name: e097_anoxia2_window_360s

paths:
  output_dir: C:/Users/lpascu/resp_analysis/outputs/e097/anoxia2_window_v2
  scratch_dir: C:/SCRATCH_neuropixels/sorting_v2/e097_anoxia2_window   # ~8.3 GB preprocessed binary + sorter folders

input:
  source: catgt   # CatGT: -apfilter=butter,12,300,9000 -loccar_um=75,300, already phase-shifted
  folder: C:/SCRATCH_neuropixels/catgt_e097_anoxia2_360s/catgt_e097_g2
  stream_id: imec0.ap
  # Spike times are seconds from the start of this CatGT file. Add 2250 s for raw-run time.

motion:
  # Off, as for the intact window (D2). Estimate-only DREDGE on this extract concatenated with the intact window
  # (2026-10-20, outputs/e097/anoxia2_drift_check): within this window 5-95th percentile -2.2 to +0.6 um outside
  # the gasping dropout, late recovery minus baseline < 0.12 um, step from the end of the intact window < 0.05 um.
  # The only "motion" is a wiggle at the top of the probe during the ~2335-2370 s raw activity dropout (unreliable).
  enabled: false

sorters:
  kilosort4:
    enabled: true
    params:
      torch_device: cuda   # fail immediately if the GPU is not visible rather than silently using the CPU
      do_correction: false
  lupin:
    enabled: true
    params:
      apply_motion_correction: false
      # Only difference from the intact window. With the default ("auto") Lupin copied its filtered recording
      # (16.6 GB float32) into Windows shared memory, and on 2026-10-20 that failed with WinError 1450
      # "Insufficient system resources" while another analysis was using RAM. "folder" writes the same data to
      # the scratch disk instead; it doesn't change what Lupin computes.
      cache_preprocessing_mode: folder
      job_kwargs:
        # Lupin's clustering gives every worker its own copy of the peak features; 12 workers ran out of
        # memory on the intact window (2026-10-16). Other job settings come from job_kwargs below.
        n_jobs: 4

job_kwargs:
  n_jobs: 12

# Epochs for the waveform-stability check, in file time (raw-run time minus 2250 s), from the session JSON
# breathing rate (1 s resolution): ~160 breaths/min before the switch; gas switch 2310-2325 s raw; breathing
# speeds up to 180-210/min at 2326-2336; gasping 2337-2352 (3 gasps, at ~2341, 2345, 2350); 2354-2370 the
# breath detector reports 0.1-0.25 s intervals (rapid bursts or detection errors, left out); ~147/min from 2370;
# slower again 2425-2540 (100-130/min); ~155/min from ~2545.
epochs:
  - {name: baseline, start_s: 0, end_s: 60}
  - {name: anoxia, start_s: 60, end_s: 87}
  - {name: gasping, start_s: 87, end_s: 104}
  - {name: recovery, start_s: 120, end_s: 175}
  - {name: slow_breathing, start_s: 175, end_s: 290}
  - {name: late_recovery, start_s: 295, end_s: 359}

curation:
  threshold_overrides:
    mua:
      # Respiratory neurons can stop firing during apnea/anoxia, so presence is reported but not used to label.
      presence_ratio: null
  # No extraction rule yet. In the intact window a positive-going cell on ch 148/150 fired only during the gasps
  # (gasp_pos_ch148, D9). Check the trace around the gasps here (87-104 s) after sorting; if it fires and no unit
  # has it, add the same rule with seed_window_s around the gasps and rerun with --redo postprocess.
  extract_units: []
