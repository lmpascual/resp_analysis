<line class="leader" x1="264" y1="110" x2="264" y2="286"/>
<line x1="208" y1="292" x2="260" y2="292" stroke="#555" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="ts" x="234" y="314" text-anchor="middle">p2t: trough to C</text>
</svg>
