# e097, intact window: 420 s CatGT extract (raw run g2, 1740-2160 s), Neuropixels imec0.
# Only settings that differ from npxsort/defaults.yaml are listed.

experiment_name: e097_intact_window_420s

paths:
  output_dir: ${outputs}/e097/intact_window_v2
  scratch_dir: ${scratch}/e097_intact_window   # ~10 GB preprocessed binary + sorter folders

input:
  source: catgt   # CatGT: -apfilter=butter,12,300,9000 -loccar_um=75,300, already phase-shifted
  folder: ${catgt}/catgt_e097_intact_420s/catgt_e097_g2
  stream_id: imec0.ap
  # Spike times are seconds from the start of this CatGT file. Add 1740 s for raw-run time.

motion:
  # Off for this recording. The first run (2026-10-15) showed no drift (median 0.3 um); DREDGE's only
  # "motion" was an unreliable +70/-45 um estimate during the ~85-125 s activity dropout, and
  # correcting it bent the spike bands. The sorters' own drift correction is switched off too.
  enabled: false

sorters:
  kilosort4:
    enabled: true
    params:
      torch_device: cuda   # fail immediately if the GPU is not visible rather than silently using the CPU
      do_correction: false
  lupin:
    enabled: true
    params:
      apply_motion_correction: false
      job_kwargs:
        # Lupin's clustering step gives every worker its own ~1.2 GB copy of the peak features
        # (1.85 M peaks). With 12 workers that ran out of memory on Windows on 2026-10-16
        # (OSError Errno 22 / pickle data was truncated). Other job settings come from job_kwargs below.
        n_jobs: 4

job_kwargs:
  n_jobs: 12

# Epochs for the waveform-stability check, in file time (raw-run time minus 1740 s). From the session's
# milestones and breathing rate (outputs/e097/e097_whole_session_data.json): N2 at 1800-1815 s raw, breathing
# drops below ~100 bpm (gasping) from ~1825 to ~1870 s, recovers to 120-140 bpm by ~1880 s, and the
# "active expiration shift" milestone is 2078-2150 s.
epochs:
  - {name: baseline, start_s: 0, end_s: 60}
  - {name: anoxia, start_s: 60, end_s: 85}
  - {name: gasping, start_s: 85, end_s: 130}
  - {name: recovery, start_s: 140, end_s: 338}
  - {name: active_expiration, start_s: 338, end_s: 410}

# NIDQ of run e097_g2 (read by analysis/population): XA0 diaphragm EMG, XA2 ECG, XA5 airflow.
nidq:
  bin: ${raw_data}/e097_g2/e097_g2_t0.nidq.bin
  emg_channel: 0
  flow_channel: 5
  ecg_channel: 2
  file_start_s: 1740.0     # CatGT -startsecs of this extract

curation:
  threshold_overrides:
    mua:
      # Bombcell demotes units present in < 70% of the recording to MUA. Respiratory neurons can
      # stop firing during apnea/anoxia, so presence is reported in units.tsv but not used to label.
      presence_ratio: null
  extract_units:
    # A positive-going cell on ch 148/150 that fires only during the gasps (~27 spikes, 103-110 s). Too small
    # for either sorter to give it a unit: Kilosort put its spikes into #361 and Lupin into #1079.
    - name: gasp_pos_ch148
      sorters: [kilosort4, lupin]
      channel: 148
      polarity: positive
      threshold_sd: 5.0
      seed_window_s: [95, 125]
    # A large negative cell on ch 53 (trough 248-312 uV; ch 55 ~0.5x, ch 51 ~0.2x) recruited only at the start of
    # gasping: 30 spikes at 87.8-92.1 s (1827.8-1832.1 s raw), none anywhere else. Seen by eye 2026-10-20 as a second
    # amplitude band of KS4 #293 during gasping. Kilosort put these events into both #293 and #292; Lupin into #433,
    # #434, #1040 and #1041. Dry run (read-only, 2026-10-20): 16 SD (~144 uV, noise SD 9.0 uV) gives exactly these 30;
    # 12 SD adds two ~110 uV spikes of #293 itself (1776 s, 1815 s raw). The rest of #293 peaks at ~64 uV on ch 53.
    - name: gasp_neg_ch53
      sorters: [kilosort4, lupin]
      channel: 53
      polarity: negative
      threshold_sd: 16.0
      seed_window_s: [87, 93]
  remove_spikes:
    # KS4 #435 is well isolated except for 6 spikes at 242.60-242.73 s (1982.60-1982.73 s raw): a smaller neighbour's
    # burst, seen on ch 240 (and clearly not #435 on ch 243); 5 of the 6 are also assigned to #428 within 0.2 ms, and
    # all 6 are footprint-mismatch flags in the review browser. Seen by eye 2026-10-19/20 (review note on #435).
    - sorter: kilosort4
      unit_id: 435
      start_s: 242.5
      end_s: 242.8
      reason: "6 spikes of a smaller neighbour on ch 240; 5 also in #428"
      expect_removed: 6
